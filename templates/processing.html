{% extends "base.html" %}
{% block title %}Processing - RetailVision AI{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6">
<h2 class="mb-1">Analysing video</h2>
<p class="text-muted">{{ video.original_name }}</p>
<div class="card rv-card"><ul class="list-group list-group-flush" id="stage-list">
  {% for s in stages %}
  <li class="list-group-item d-flex justify-content-between" data-idx="{{ loop.index0 }}">
    <span>{{ s }}</span><span class="stage-mark">&middot;</span></li>
  {% endfor %}
</ul></div>
<p class="mt-3 text-muted" id="status-text">Starting...</p>
<div id="error-box" class="alert alert-danger d-none"></div>
<a id="retry" class="btn btn-outline-secondary d-none" href="{{ url_for('process', video_id=video.id, rerun=1) }}">Try again</a>
</div></div>
{% endblock %}
{% block scripts %}
<script>
const statusUrl = "{{ url_for('status', video_id=video.id) }}";
const resultsUrl = "{{ url_for('results', video_id=video.id) }}";
function paint(job) {
  document.querySelectorAll('#stage-list li').forEach(li => {
    const i = +li.dataset.idx, mark = li.querySelector('.stage-mark');
    if (job.state === 'done' || i < job.stage) { mark.textContent = '\u2713'; mark.className = 'stage-mark text-success fw-bold'; }
    else if (i === job.stage && job.state === 'running') { mark.innerHTML = '<span class="spinner-border spinner-border-sm"></span>'; }
    else { mark.textContent = '\u00b7'; mark.className = 'stage-mark'; }
  });
  document.getElementById('status-text').textContent = job.text || '';
}
async function poll() {
  try {
    const job = await (await fetch(statusUrl)).json();
    paint(job);
    if (job.state === 'done') { setTimeout(() => location.href = resultsUrl, 700); return; }
    if (job.state === 'error') {
      const box = document.getElementById('error-box');
      box.textContent = 'Error: ' + job.error; box.classList.remove('d-none');
      document.getElementById('retry').classList.remove('d-none'); return;
    }
  } catch (e) { console.error(e); }
  setTimeout(poll, 1200);
}
poll();
</script>
{% endblock %}
